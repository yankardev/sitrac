spring.application.name=operaciones-service
server.port=8083

spring.datasource.url=${MYSQL_OPERACIONES_URL:jdbc:mysql://localhost:3306/sitrac_operaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

# Programación, viaje y combustible viven en el mismo proceso; estos valores solo
# permiten construir los adaptadores REST heredados, que quedan desplazados por @Primary.
services.programacion.url=http://localhost:${server.port}
# SOMMA/prevención sí pertenece a otro contexto.
services.somma.url=${PREVENCION_SERVICE_URL:http://localhost:8085}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:sitrac}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:sitracmq}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
