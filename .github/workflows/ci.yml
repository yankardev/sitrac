name: SITRAC CI

on:
  push:
    branches: [master, final/alinear-informe-sitrac]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar backend
        run: bash ./mvnw -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitrac-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sitrac-frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar Docker Compose
        run: docker compose config --quiet
