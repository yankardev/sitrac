<g transform="translate(740,700)"><rect width="250" height="150" class="box"/><rect width="250" height="42" rx="16" class="hdr"/><text x="125" y="28" text-anchor="middle" class="svc" fill="white">somma-service</text><text x="18" y="70" class="small">Charlas y capacitaciones</text><text x="18" y="96" class="small">Incidentes / accidentes</text><text x="18" y="122" class="small">Seguridad operacional</text><ellipse cx="125" cy="185" rx="58" ry="16" class="db"/><rect x="67" y="169" width="116" height="31" class="db"/><text x="125" y="191" text-anchor="middle" class="small">MySQL somma_db</text></g>
<g transform="translate(1055,700)"><rect width="250" height="150" class="box"/><rect width="250" height="42" rx="16" class="hdr"/><text x="125" y="28" text-anchor="middle" class="svc" fill="white">combustible-service</text><text x="18" y="70" class="small">Abastecimientos</text><text x="18" y="96" class="small">Interno / tercero</text><text x="18" y="122" class="small">Galones / costos</text><ellipse cx="125" cy="185" rx="58" ry="16" class="db"/><rect x="67" y="169" width="116" height="31" class="db"/><text x="125" y="191" text-anchor="middle" class="small">MySQL combustible_db</text></g>
