<g transform="translate(1030,145)"><rect width="250" height="145" class="box"/><rect width="250" height="42" rx="16" class="hdr"/><text x="125" y="28" text-anchor="middle" class="svc" fill="white">pedido-service</text><text x="18" y="70" class="small">Pedidos de transporte</text><text x="18" y="94" class="small">Tipo de carga / tonelaje</text><text x="18" y="118" class="small">Estados y validaciones</text><ellipse cx="125" cy="178" rx="58" ry="16" class="db"/><rect x="67" y="162" width="116" height="31" class="db"/><text x="125" y="184" text-anchor="middle" class="small">MySQL pedido_db</text></g>
