<g transform="translate(1025,395)"><rect width="275" height="160" class="box"/><rect width="275" height="42" rx="16" class="hdr"/><text x="138" y="28" text-anchor="middle" class="svc" fill="white">flota-service</text><text x="18" y="70" class="small">Tractos y semirremolques</text><text x="18" y="96" class="small">Capacidad / tipo</text><text x="18" y="122" class="small">DISPONIBLE / ASIGNADO</text><ellipse cx="138" cy="195" rx="60" ry="16" class="db"/><rect x="78" y="179" width="120" height="31" class="db"/><text x="138" y="201" text-anchor="middle" class="small">MySQL flota_db</text></g>
