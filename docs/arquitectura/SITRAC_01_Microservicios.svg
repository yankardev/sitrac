<!-- middle -->
<g transform="translate(355,395)"><rect width="255" height="160" class="box"/><rect width="255" height="42" rx="16" class="hdr"/><text x="128" y="28" text-anchor="middle" class="svc" fill="white">conductor-service</text><text x="18" y="70" class="small">Conductores y licencias</text><text x="18" y="96" class="small">Disponibilidad</text><text x="18" y="122" class="small">Estado activo</text><ellipse cx="128" cy="195" rx="60" ry="16" class="db"/><rect x="68" y="179" width="120" height="31" class="db"/><text x="128" y="201" text-anchor="middle" class="small">MySQL conductor_db</text></g>
