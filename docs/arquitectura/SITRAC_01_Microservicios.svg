<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<style>
text{font-family:Arial,sans-serif;fill:#12355b}.title{font-size:34px;font-weight:700;fill:white}.sub{font-size:20px;fill:white}.box{fill:#f8fbff;stroke:#1769aa;stroke-width:3;rx:16}.hdr{fill:#0f5c96}.svc{font-size:20px;font-weight:700}.small{font-size:15px}.db{fill:#e8f4ff;stroke:#1769aa;stroke-width:2}.arrow{stroke:#1769aa;stroke-width:3;fill:none;marker-end:url(#a)}.label{font-size:14px;font-weight:700}.legend{font-size:15px}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker></defs>
<rect x="20" y="20" width="1560" height="95" rx="16" fill="#0f5c96"/><text x="800" y="62" text-anchor="middle" class="title">SITRAC – Arquitectura General del Sistema</text><text x="800" y="94" text-anchor="middle" class="sub">Sistema Integral de Transporte de Carga</text>
<g><rect x="40" y="165" width="205" height="145" class="box"/><rect x="40" y="165" width="205" height="42" rx="16" class="hdr"/><text x="142" y="193" text-anchor="middle" class="svc" fill="white">Cliente web / Postman</text><text x="142" y="245" text-anchor="middle" class="small">Consume APIs REST</text><text x="142" y="273" text-anchor="middle" class="small">HTTP / JSON</text></g>
<path d="M245 238 H315" class="arrow"/><text x="275" y="225" class="label">REST</text>

