<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:Arial,sans-serif;fill:#12355b}.title{font-size:36px;font-weight:700;fill:white}.box{stroke-width:3;rx:16}.hdr{font-size:22px;font-weight:700}.small{font-size:16px}.arrow{stroke:#1769aa;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker></defs><rect x="20" y="20" width="1560" height="85" rx="15" fill="#0f5c96"/><text x="800" y="72" text-anchor="middle" class="title">SITRAC – Vista MVC / por Capas</text>
<rect x="55" y="300" width="230" height="190" fill="#eef7ff" stroke="#1769aa" class="box"/><text x="170" y="345" text-anchor="middle" class="hdr">Cliente / API Consumer</text><text x="80" y="390" class="small">• Aplicación web</text><text x="80" y="420" class="small">• Postman</text><text x="80" y="450" class="small">• Otro sistema REST</text>
<rect x="350" y="285" width="260" height="220" fill="#ecfdf5" stroke="#2a9d5b" class="box"/><text x="480" y="335" text-anchor="middle" class="hdr">Controller</text><text x="480" y="365" text-anchor="middle" class="small">(Spring MVC)</text><text x="375" y="405" class="small">• Recibe HTTP</text><text x="375" y="435" class="small">• Valida DTO</text><text x="375" y="465" class="small">• Llama casos de uso</text>
<rect x="690" y="285" width="260" height="220" fill="#fff7e6" stroke="#f28c28" class="box"/><text x="820" y="335" text-anchor="middle" class="hdr">Service / Use Case</text><text x="715" y="395" class="small">• Lógica de negocio</text><text x="715" y="425" class="small">• Reglas y validaciones</text><text x="715" y="455" class="small">• Orquesta puertos</text>
<rect x="1030" y="285" width="260" height="220" fill="#f5efff" stroke="#7950b3" class="box"/><text x="1160" y="335" text-anchor="middle" class="hdr">Repository / Adapter</text><text x="1160" y="365" text-anchor="middle" class="small">(Spring Data JPA)</text><text x="1055" y="405" class="small">• Persistencia</text><text x="1055" y="435" class="small">• CRUD / consultas</text><text x="1055" y="465" class="small">• Entidades JPA</text>
<rect x="1365" y="320" width="180" height="150" fill="#eef7ff" stroke="#1769aa" class="box"/><text x="1455" y="365" text-anchor="middle" class="hdr">MySQL</text><text x="1455" y="405" text-anchor="middle" class="small">BD del servicio</text>
<path d="M285 395 H350" class="arrow"/><path d="M610 395 H690" class="arrow"/><path d="M950 395 H1030" class="arrow"/><path d="M1290 395 H1365" class="arrow"/>
<rect x="430" y="590" width="260" height="135" fill="#eef7ff" stroke="#1769aa" class="box"/><text x="560" y="630" text-anchor="middle" class="hdr">DTO Request/Response</text><text x="455" y="675" class="small">• Transferencia de datos</text><text x="455" y="705" class="small">• Bean Validation</text><line x1="480" y1="505" x2="560" y2="590" stroke="#1769aa" stroke-width="2" stroke-dasharray="8,8"/>
<rect x="915" y="590" width="260" height="135" fill="#f5efff" stroke="#7950b3" class="box"/><text x="1045" y="630" text-anchor="middle" class="hdr">Entity / Model</text><text x="940" y="675" class="small">• Entidades JPA</text><text x="940" y="705" class="small">• Modelo persistente</text><line x1="1160" y1="505" x2="1045" y2="590" stroke="#7950b3" stroke-width="2" stroke-dasharray="8,8"/>
<rect x="600" y="135" width="400" height="110" fill="#fff0f0" stroke="#d62828" class="box"/><text x="800" y="175" text-anchor="middle" class="hdr">Security</text><text x="800" y="205" text-anchor="middle" class="small">Spring Security + BCrypt</text><text x="800" y="232" text-anchor="middle" class="small">Autenticación · autorización · roles</text>
<rect x="170" y="790" width="1260" height="60" rx="14" fill="#eaf5ff" stroke="#b7d4ea" stroke-width="2"/><text x="800" y="828" text-anchor="middle" class="small">En SITRAC esta vista técnica convive con la arquitectura hexagonal: Controller y Repository son adaptadores; Service implementa casos de uso.</text></svg>