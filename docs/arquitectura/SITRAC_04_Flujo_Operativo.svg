<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><style>text{font-family:Arial,sans-serif;fill:#12355b}.title{font-size:35px;font-weight:700;fill:white}.lane{font-size:21px;font-weight:700;fill:white}.box{fill:#fff;stroke:#1769aa;stroke-width:3}.hdrb{fill:#0f5c96}.hdro{fill:#f28c28}.small{font-size:15px}.bold{font-size:18px;font-weight:700}.arrow{stroke:#1769aa;stroke-width:3;fill:none;marker-end:url(#a)}.green{fill:#ecfdf5;stroke:#2a9d5b}.orange{fill:#fff7e6;stroke:#f28c28}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker></defs><rect x="20" y="20" width="1560" height="85" rx="15" fill="#0f5c96"/><text x="800" y="72" text-anchor="middle" class="title">SITRAC – Flujo Operativo Integrado</text>
<rect x="30" y="125" width="280" height="55" rx="12" class="hdrb"/><text x="170" y="160" text-anchor="middle" class="lane">Comercial</text><rect x="315" y="125" width="300" height="55" rx="12" class="hdro"/><text x="465" y="160" text-anchor="middle" class="lane">Programación</text><rect x="620" y="125" width="270" height="55" rx="12" fill="#4aa8df"/><text x="755" y="160" text-anchor="middle" class="lane">SOMMA</text><rect x="895" y="125" width="270" height="55" rx="12" class="hdro"/><text x="1030" y="160" text-anchor="middle" class="lane">Combustible</text><rect x="1170" y="125" width="400" height="55" rx="12" class="hdrb"/><text x="1370" y="160" text-anchor="middle" class="lane">Operaciones</text>
<rect x="55" y="220" width="230" height="120" rx="14" class="box"/><text x="170" y="255" text-anchor="middle" class="bold">1. Cliente solicita transporte</text><text x="80" y="295" class="small">Solicitud de servicio</text><text x="80" y="320" class="small">Origen, destino y carga</text>
<rect x="55" y="395" width="230" height="150" rx="14" class="box"/><text x="170" y="430" text-anchor="middle" class="bold">2. Registro de pedido</text><text x="80" y="470" class="small">• Cliente</text><text x="80" y="495" class="small">• Tipo de carga / toneladas</text><text x="80" y="520" class="small">• Origen / destino</text>
<path d="M170 340 V395" class="arrow"/>
<rect x="350" y="260" width="230" height="180" rx="14" class="box"/><text x="465" y="295" text-anchor="middle" class="bold">3. Programación</text><text x="375" y="335" class="small">• validar pedido</text><text x="375" y="360" class="small">• conductor</text><text x="375" y="385" class="small">• tracto</text><text x="375" y="410" class="small">• semirremolque</text>
<path d="M285 470 H350" class="arrow"/><rect x="380" y="495" width="170" height="80" rx="12" class="green"/><text x="465" y="528" text-anchor="middle" class="bold">Pedido PROGRAMADO</text><text x="465" y="555" text-anchor="middle" class="small">Recursos asignados</text><path d="M465 440 V495" class="arrow"/>
<rect x="650" y="260" width="210" height="180" rx="14" class="box"/><text x="755" y="295" text-anchor="middle" class="bold">4. Charla / control SOMMA</text><text x="675" y="335" class="small">• charla de seguridad</text><text x="675" y="360" class="small">• control del conductor</text><text x="675" y="385" class="small">• incidentes / observaciones</text><rect x="675" y="495" width="160" height="80" rx="12" class="green"/><text x="755" y="528" text-anchor="middle" class="bold">SOMMA válido</text><text x="755" y="555" text-anchor="middle" class="small">Apto para operar</text><path d="M550 535 H675" class="arrow"/><path d="M755 440 V495" class="arrow"/>
<rect x="925" y="260" width="210" height="180" rx="14" class="box"/><text x="1030" y="295" text-anchor="middle" class="bold">5. Abastecimiento</text><text x="955" y="335" class="small">• interno o tercero</text><text x="955" y="360" class="small">• galones / kilometraje</text><text x="955" y="385" class="small">• costo / comprobante</text><rect x="950" y="495" width="160" height="80" rx="12" class="orange"/><text x="1030" y="528" text-anchor="middle" class="bold">Combustible listo</text><text x="1030" y="555" text-anchor="middle" class="small">Preparado para viajar</text><path d="M835 535 H950" class="arrow"/><path d="M1030 440 V495" class="arrow"/>
<rect x="1205" y="220" width="330" height="110" rx="14" class="box"/><text x="1370" y="255" text-anchor="middle" class="bold">6. Inicio de viaje</text><text x="1235" y="295" class="small">Estado → EN_VIAJE · fechaInicio · kmInicial</text>
<rect x="1205" y="380" width="330" height="110" rx="14" class="box"/><text x="1370" y="415" text-anchor="middle" class="bold">7. Viaje en curso</text><text x="1235" y="455" class="small">Seguimiento operativo y novedades</text>
<rect x="1205" y="540" width="330" height="110" rx="14" class="box"/><text x="1370" y="575" text-anchor="middle" class="bold">8. Finalización del viaje</text><text x="1235" y="615" class="small">fechaFin · kmFinal · estado FINALIZADO</text>
<rect x="1205" y="700" width="330" height="120" rx="14" class="box"/><text x="1370" y="735" text-anchor="middle" class="bold">9. Liberación de recursos y cierre</text><text x="1235" y="775" class="small">Conductor y flota vuelven a DISPONIBLE</text><text x="1235" y="800" class="small">Pedido finalizado</text>
<path d="M1110 535 H1170 V275 H1205" class="arrow"/><path d="M1370 330 V380" class="arrow"/><path d="M1370 490 V540" class="arrow"/><path d="M1370 650 V700" class="arrow"/>
<rect x="40" y="875" width="1520" height="180" rx="16" fill="#f7fbff" stroke="#b7d4ea" stroke-width="2"/><text x="70" y="915" class="bold">Estados clave</text><text x="70" y="955" class="small">Pedido:</text><text x="150" y="955" class="small">REGISTRADO → PROGRAMADO → EN_VIAJE → FINALIZADO</text><text x="70" y="995" class="small">Conductor:</text><text x="170" y="995" class="small">DISPONIBLE → NO DISPONIBLE → DISPONIBLE</text><text x="70" y="1035" class="small">Flota:</text><text x="150" y="1035" class="small">DISPONIBLE → ASIGNADO → DISPONIBLE</text></svg>