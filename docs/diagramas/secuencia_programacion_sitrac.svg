xt x="675.0" y="422" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#16365C;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;">GET /api/conductores/{id}</text><line x1="930" y1="476" x2="426" y2="476" stroke="#5B6770" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ag)"/><text x="675.0" y="468" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5B6770;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;">activo, disponible, licencia vigente</text><line x1="420" y1="522" x2="1164" y2="522" stroke="#16365C" stroke-width="2"  marker-end="url(#a)"/><text x="795.0" y="514" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#16365C;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;">GET /api/tractos/{id} y /api/semirremolques/{id}</text><line x1="1170" y1="568" x2="426" y2="568" stroke="#5B6770" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ag)"/><text x="795.0" y="560" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5B6770;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;">DISPONIBLE, capacidad, tipo (BOMBONA…)</text><path d="M420 614 h60 v28 h-56" fill="none" stroke="#16365C" stroke-width="2" marker-end="url(#a)"/><text x="490" y="632" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#16365C;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;">valida capacidad y compatibilidad carga ↔ semirremolque</text><rect x="340" y="658" width="950" height="58" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-dasharray="6 4"/><text x="350" y="682" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#C0392B;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">alt  regla incumplida</text><text x="275.0" y="702"