<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0B3A6E"/></marker></defs><rect width="1600" height="1000" fill="#fff"/><text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0B3A6E">Vista por capas de un microservicio SITRAC</text><text x="800" y="92" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#5E6B75">Representación explicativa equivalente a la organización hexagonal real</text><g font-family="Arial"><rect x="180" y="170" width="980" height="110" rx="14" fill="#fff" stroke="#0B3A6E" stroke-width="2"/><rect x="180" y="170" width="320" height="110" rx="14" fill="#0B3A6E"/><text x="340" y="212" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1. Presentación</text><text x="340" y="248" text-anchor="middle" font-size="15" fill="#fff">Entrada/salida HTTP y validación</text><text x="780" y="218" text-anchor="middle" font-size="23" font-weight="700" fill="#0B3A6E">Controller + DTO</text><rect x="180" y="315" width="980" height="110" rx="14" fill="#fff" stroke="#0B3A6E" stroke-width="2"/><rect x="180" y="315" width="320" height="110" rx="14" fill="#0B3A6E"/><text x="340" y="357" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2. Aplicación / Servicio</text><text x="340" y="393" text-anchor="middle" font-size="15" fill="#fff">Orquesta reglas y flujo</text><text x="780" y="363" text-anchor="middle" font-size="23" font-weight="700" fill="#0B3A6E">Services / Casos de uso</text><rect x="180" y="460" width="980" height="110" rx="14" fill="#fff" stroke="#0B3A6E" stroke-width="2"/><rect x="180" y="460" width="320" height="110" rx="14" fill="#0B3A6E"/><text x="340" y="502" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3. Dominio</text><text x="340" y="538" text-anchor="middle" font-size="15" fill="#fff">Modelo y reglas del negocio</text><text x="780" y="508" text-anchor="middle" font-size="23" font-weight="700" fill="#0B3A6E">Entidades + Reglas de negocio</text><rect x="180" y="605" width="980" height="110" rx="14" fill="#fff" stroke="#0B3A6E" stroke-width="2"/><rect x="180" y="605" width="320" height="110" rx="14" fill="#0B3A6E"/><text x="340" y="647" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4. Infraestructura</text><text x="340" y="683" text-anchor="middle" font-size="15" fill="#fff">Persistencia e integración externa</text><text x="780" y="653" text-anchor="middle" font-size="23" font-weight="700" fill="#0B3A6E">Repository + JPA + Clientes REST</text><rect x="180" y="750" width="980" height="110" rx="14" fill="#fff" stroke="#0B3A6E" stroke-width="2"/><rect x="180" y="750" width="320" height="110" rx="14" fill="#0B3A6E"/><text x="340" y="792" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">5. Persistencia</text><text x="340" y="828" text-anchor="middle" font-size="15" fill="#fff">Base de datos propia</text><text x="780" y="798" text-anchor="middle" font-size="23" font-weight="700" fill="#0B3A6E">MySQL</text></g><g stroke="#0B3A6E" stroke-width="3" marker-end="url(#a)"><line x1="670" y1="280" x2="670" y2="315"/><line x1="670" y1="425" x2="670" y2="460"/><line x1="670" y1="570" x2="670" y2="605"/><line x1="670" y1="715" x2="670" y2="750"/></g><rect x="1220" y="485" width="310" height="300" rx="16" fill="#EEF6FB" stroke="#0B3A6E" stroke-width="2"/><text x="1375" y="525" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0B3A6E">Servicios externos</text><g font-family="Arial" font-size="17" font-weight="700" fill="#17324D"><text x="1375" y="590" text-anchor="middle">pedido-service</text><text x="1375" y="655" text-anchor="middle">conductor-service</text><text x="1375" y="720" text-anchor="middle">flota-service</text></g><line x1="1160" y1="660" x2="1220" y2="660" stroke="#0B3A6E" stroke-width="3" marker-end="url(#a)"/><text x="1190" y="645" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#0B3A6E">REST</text><rect x="560" y="105" width="220" height="55" rx="12" fill="#EEF6FB" stroke="#0E6BA8" stroke-width="2"/><text x="670" y="140" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0B3A6E">Solicitud HTTP</text><rect x="560" y="895" width="220" height="55" rx="12" fill="#EEF6FB" stroke="#0E6BA8" stroke-width="2"/><text x="670" y="930" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0B3A6E">Respuesta JSON</text></svg>