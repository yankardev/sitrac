-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;">desde PROGRAMADO o EN_VIAJE · solo un viaje CANCELADO puede eliminarse</text><rect x="40" y="510" width="1520" height="180" rx="14" fill="#F7F9FC" stroke="#D5DEE8"/><text x="70" y="542" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#16365C;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">Programación (programacion-service)</text><rect x="90" y="570" width="200" height="56" rx="28" fill="#16365C"/><text x="190" y="605" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">PROGRAMADA</text><line x1="290" y1="598" x2="384" y2="598" stroke="#16365C" stroke-width="2"  marker-end="url(#a)"/><text x="340.0" y="560" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:#F7F9FC;stroke-width:6px;stroke-linejoin:round;">viaje finalizado</text><rect x="390" y="570" width="200" height="56" rx="28" fill="#2E9E5B"/><text x="490" y="605" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">FINALIZADA</text><rect x="1310" y="570" width="200" height="56" rx="28" fill="#C0392B"/><text x="1410" y="605" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">CANCELADA</text><path d="M190 626 V660 H1410 V632" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="800.0" y="678" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;">cancelación del viaje · los estados finales no se reactivan</text><rect x="40" y="710" width="1520" height="180" rx="14" fill="#F7F9FC" stroke="#D5DEE8"/><text x="70" y="742" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#16365C;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">Unidad de flota (flota-service)</text><rect x="90" y="770" width="200" height="56" rx="28" fill="#16365C"/><text x="190" y="805" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">DISPONIBLE</text><line x1="290" y1="798" x2="384" y2="798" stroke="#16365C" stroke-width="2"  marker-end="url(#a)"/><text x="340.0" y="760" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:#F7F9FC;stroke-width:6px;stroke-linejoin:round;">programación creada</text><rect x="390" y="770" width="200" height="56" rx="28" fill="#2E75B6"/><text x="490" y="805" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">ASIGNADO</text><rect x="1310" y="770" width="200" height="56" rx="28" fill="#F28C28"/><text x="1410" y="805" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">MANTENIMIENTO</text><path d="M190 826 V860 H1410 V832" fill="none" stroke="#F28C28" stroke-width="2" marker-end="url(#a)"/><text x="800.0" y="878" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;">mantenimiento EN_PROCESO (vuelve a DISPONIBLE al finalizar o cancelar; al finalizar el viaje la unidad se libera)</text></svg>