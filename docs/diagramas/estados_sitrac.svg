ke-width:6px;stroke-linejoin:round;">inicia el viaje</text><rect x="690" y="170" width="200" height="56" rx="28" fill="#2E75B6"/><text x="790" y="205" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">EN_VIAJE</text><line x1="890" y1="198" x2="984" y2="198" stroke="#16365C" stroke-width="2"  marker-end="url(#a)"/><text x="940.0" y="160" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:#F7F9FC;stroke-width:6px;stroke-linejoin:round;">finaliza el viaje</text><rect x="990" y="170" width="200" height="56" rx="28" fill="#2E9E5B"/><text x="1090" y="205" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">FINALIZADO</text><rect x="1310" y="170" width="200" height="56" rx="28" fill="#C0392B"/><text x="1410" y="205" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:white;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">CANCELADO</text><path d="M190 226 V260 H1410 V232" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="800.0" y="278" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5B6770;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;">cancelación del viaje: vuelve a REGISTRADO si no había iniciado; CANCELADO si estaba EN_VIAJE</text><rect x="40" y="310" width="1520" height="180" rx="14" fill="#F7F9FC" stroke="#D5DEE8"/><text x="70" y="342" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#16365C;paint-order:stroke;stroke:none;stroke-width:6px;stroke-linejoin:round;font-weight:bold">Viaje (viaje-service)</text><rect x="90" y="3