spring.application.name=recursos-service
server.port=8084

spring.datasource.url=${MYSQL_RECURSOS_URL:jdbc:mysql://localhost:3306/sitrac_recursos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

# Mantenimiento y flota ahora viven en el mismo contexto; el adaptador local @Primary evita HTTP interno.
services.flota.url=http://localhost:${server.port}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
