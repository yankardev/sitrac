spring.application.name=prevencion-service
server.port=8085

spring.datasource.url=${MYSQL_PREVENCION_URL:jdbc:mysql://localhost:3306/sitrac_prevencion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

# Prevención consulta programaciones del contexto operativo.
services.programacion.url=${OPERACIONES_SERVICE_URL:http://localhost:8083}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
