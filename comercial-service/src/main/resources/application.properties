spring.application.name=comercial-service
server.port=8082

spring.datasource.url=${MYSQL_COMERCIAL_URL:jdbc:mysql://localhost:3306/sitrac_comercial?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

# Compatibilidad del adaptador antiguo; la consulta cliente-pedido se resuelve localmente con @Primary.
services.cliente.url=http://localhost:${server.port}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
