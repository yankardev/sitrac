server:
  port: 8091

spring:
  application:
    name: notification-service
  datasource:
    url: ${MYSQL_NOTIFICATION_URL:jdbc:mysql://localhost:3306/sitrac_notificaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:sitrac}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:sitrac}
    password: ${RABBITMQ_PASSWORD:sitracmq}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

sitrac:
  mail:
    enabled: ${SITRAC_MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
