server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:4200
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: '*'
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: comercial-clientes
              uri: lb://comercial-service
              predicates:
                - Path=/api/clientes/**
            - id: comercial-pedidos
              uri: lb://comercial-service
              predicates:
                - Path=/api/pedidos/**

            - id: recursos-conductores
              uri: lb://recursos-service
              predicates:
                - Path=/api/conductores/**
            - id: recursos-tractos
              uri: lb://recursos-service
              predicates:
                - Path=/api/tractos/**
            - id: recursos-semirremolques
              uri: lb://recursos-service
              predicates:
                - Path=/api/semirremolques/**
            - id: recursos-mantenimientos
              uri: lb://recursos-service
              predicates:
                - Path=/api/mantenimientos/**

            - id: operaciones-programaciones
              uri: lb://operaciones-service
              predicates:
                - Path=/api/programaciones/**
            - id: operaciones-viajes
              uri: lb://operaciones-service
              predicates:
                - Path=/api/viajes/**
            - id: operaciones-combustible
              uri: lb://operaciones-service
              predicates:
                - Path=/api/combustible/**

            - id: prevencion-somma
              uri: lb://prevencion-service
              predicates:
                - Path=/api/somma/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
