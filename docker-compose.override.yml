# Ajustes de desarrollo cargados automáticamente junto con docker-compose.yml.
# Mantiene credenciales de RabbitMQ consistentes y aplica la migración del alcance final.
services:
  mysql:
    volumes:
      - ./database/sitrac_alcance_final.sql:/docker-entrypoint-initdb.d/02-sitrac_alcance_final.sql:ro

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sitracmq}

  programacion-service:
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-sitrac}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}

  viaje-service:
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-sitrac}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}

  combustible-service:
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-sitrac}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}

  notification-service:
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
