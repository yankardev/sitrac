<div class="app-shell">
  <aside class="sidebar">
    <a routerLink="/dashboard" class="sidebar-brand">
      <div class="logo">S</div>
      <div class="brand-copy">
        <strong>SITRAC</strong>
        <span>Gestión de Transporte</span>
      </div>
    </a>

    <div class="menu-label">PRINCIPAL</div>

    <nav class="menu">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item">
        <span class="icon">⌂</span>
        <span>Dashboard</span>
      </a>

      <ng-container *ngIf="puedeAcceder('ADMIN', 'OPERADOR')">
        <a routerLink="/clientes" routerLinkActive="active" class="menu-item">
          <span class="icon">▣</span>
          <span>Clientes</span>
        </a>

        <a routerLink="/pedidos" routerLinkActive="active" class="menu-item">
          <span class="icon">◫</span>
          <span>Pedidos</span>
        </a>

        <a routerLink="/programacion" routerLinkActive="active" class="menu-item">
          <span class="icon">◉</span>
          <span>Programación</span>
        </a>

        <div class="menu-label">OPERACIONES</div>

        <a routerLink="/conductores" routerLinkActive="active" class="menu-item">
          <span class="icon">♙</span>
          <span>Conductores</span>
        </a>

        <a routerLink="/flota" routerLinkActive="active" class="menu-item">
          <span class="icon">▰</span>
          <span>Flota</span>
        </a>

        <a routerLink="/viajes" routerLinkActive="active" class="menu-item">
          <span class="icon">➜</span>
          <span>Viajes</span>
        </a>

        <a routerLink="/combustible" routerLinkActive="active" class="menu-item">
          <span class="icon">◆</span>
          <span>Combustible</span>
        </a>
      </ng-container>

      <ng-container *ngIf="puedeAcceder('ADMIN', 'SOMMA') || puedeAcceder('ADMIN')">
        <div class="menu-label">CONTROL</div>
      </ng-container>

      <a
        *ngIf="puedeAcceder('ADMIN')"
        routerLink="/mantenimiento"
        routerLinkActive="active"
        class="menu-item">
        <span class="icon">⚙</span>
        <span>Mantenimiento</span>
      </a>

      <a
        *ngIf="puedeAcceder('ADMIN', 'SOMMA')"
        routerLink="/somma"
        routerLinkActive="active"
        class="menu-item">
        <span class="icon">✓</span>
        <span>SOMMA</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-mini">
        <div class="avatar">{{ inicialUsuario }}</div>
        <div>
          <strong>{{ usuario?.nombreCompleto || 'Usuario SITRAC' }}</strong>
          <span>{{ usuario?.rol || 'SIN ROL' }}</span>
        </div>
      </div>

      <button
        type="button"
        class="logout"
        title="Cerrar sesión"
        (click)="cerrarSesion()">
        Salir
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
