server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los nombres de host son los servicios definidos en docker-compose.yml
    location /api/auth               { proxy_pass http://auth-service:8081; }
    location /api/clientes           { proxy_pass http://cliente-service:8082; }
    location /api/pedidos            { proxy_pass http://pedido-service:8083; }
    location /api/conductores        { proxy_pass http://conductor-service:8084; }
    location /api/tractos            { proxy_pass http://flota-service:8085; }
    location /api/semirremolques     { proxy_pass http://flota-service:8085; }
    location /api/programaciones     { proxy_pass http://programacion-service:8086; }
    location /api/viajes             { proxy_pass http://viaje-service:8087; }
    location /api/mantenimientos     { proxy_pass http://mantenimiento-service:8088; }
    location /api/somma              { proxy_pass http://somma-service:8089; }
    location /api/combustible        { proxy_pass http://combustible-service:8090; }

    # Rutas de Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
