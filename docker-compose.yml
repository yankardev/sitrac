# SITRAC - infraestructura distribuida consolidada
# MySQL + RabbitMQ + Eureka + API Gateway + 6 microservicios funcionales + Angular
#
# Microservicios funcionales:
#   auth, comercial, operaciones, recursos, prevencion, notification
#
# Levantar todo:
#   docker compose up -d --build
#
# Frontend:          http://localhost:4200
# API Gateway:       http://localhost:8080
# Eureka Dashboard:  http://localhost:8761
# RabbitMQ Admin:    http://localhost:15672  (sitrac / sitracmq)
# MySQL:             localhost:3307 (root / sitrac)

x-common-env: &common-env
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sitrac}
  EUREKA_URL: http://eureka-server:8761/eureka/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-service: &service
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    eureka-server:
      condition: service_started

services:
  mysql:
    image: mysql:8.4
    container_name: sitrac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sitrac}
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/sitrac_demo_exposicion.sql:/docker-entrypoint-initdb.d/01-sitrac_demo_exposicion.sql:ro
      - ./database/sitrac_consolidado.sql:/docker-entrypoint-initdb.d/02-sitrac_consolidado.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: sitrac-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sitracmq}
      TZ: America/Lima
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  eureka-server:
    build:
      context: .
      args:
        SERVICE: eureka-server
    image: sitrac/eureka-server
    container_name: sitrac-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: sitrac/api-gateway
    container_name: sitrac-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  auth-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: auth-service
    image: sitrac/auth-service
    container_name: sitrac-auth-service
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      MYSQL_URL: "jdbc:mysql://mysql:3306/sitrac_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  comercial-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: comercial-service
    image: sitrac/comercial-service
    container_name: sitrac-comercial-service
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      MYSQL_COMERCIAL_URL: "jdbc:mysql://mysql:3306/sitrac_comercial?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  recursos-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: recursos-service
    image: sitrac/recursos-service
    container_name: sitrac-recursos-service
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      MYSQL_RECURSOS_URL: "jdbc:mysql://mysql:3306/sitrac_recursos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  prevencion-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: prevencion-service
    image: sitrac/prevencion-service
    container_name: sitrac-prevencion-service
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      MYSQL_PREVENCION_URL: "jdbc:mysql://mysql:3306/sitrac_prevencion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      OPERACIONES_SERVICE_URL: http://operaciones-service:8083

  operaciones-service:
    build:
      context: .
      args:
        SERVICE: operaciones-service
    image: sitrac/operaciones-service
    container_name: sitrac-operaciones-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      MYSQL_OPERACIONES_URL: "jdbc:mysql://mysql:3306/sitrac_operaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      PREVENCION_SERVICE_URL: http://prevencion-service:8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    image: sitrac/notification-service
    container_name: sitrac-notification-service
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
      SITRAC_MAIL_ENABLED: ${SITRAC_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      comercial-service:
        condition: service_started
      operaciones-service:
        condition: service_started

  frontend:
    build: ./sitrac-frontend
    image: sitrac/frontend
    container_name: sitrac-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
