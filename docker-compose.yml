# SITRAC - entorno integrado para desarrollo y sustentacion
# Angular + API Gateway + Eureka + 9 microservicios funcionales + RabbitMQ + MySQL
#
# Levantar todo:
#   docker compose up -d --build
#
# Frontend:          http://localhost:4200
# API Gateway:       http://localhost:8080
# Eureka Dashboard:  http://localhost:8761
# RabbitMQ Admin:    http://localhost:15672
# MySQL:             localhost:3307

x-common-env: &common-env
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sitrac}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-service: &service
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    eureka-server:
      condition: service_started

services:
  mysql:
    image: mysql:8.4
    container_name: sitrac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sitrac}
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/sitrac_demo_exposicion.sql:/docker-entrypoint-initdb.d/01-sitrac_demo_exposicion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: sitrac-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sitracmq}
      TZ: America/Lima
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  eureka-server:
    build:
      context: .
      args:
        SERVICE: eureka-server
    image: sitrac/eureka-server
    container_name: sitrac-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: sitrac/api-gateway
    container_name: sitrac-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  auth-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: auth-service
    image: sitrac/auth-service
    container_name: sitrac-auth-service
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      MYSQL_URL: "jdbc:mysql://mysql:3306/sitrac_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  cliente-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: cliente-service
    image: sitrac/cliente-service
    container_name: sitrac-cliente-service
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      MYSQL_CLIENTE_URL: "jdbc:mysql://mysql:3306/sitrac_clientes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  pedido-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: pedido-service
    image: sitrac/pedido-service
    container_name: sitrac-pedido-service
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      MYSQL_PEDIDO_URL: "jdbc:mysql://mysql:3306/sitrac_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      CLIENTE_SERVICE_URL: http://cliente-service:8082

  conductor-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: conductor-service
    image: sitrac/conductor-service
    container_name: sitrac-conductor-service
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      MYSQL_CONDUCTOR_URL: "jdbc:mysql://mysql:3306/sitrac_conductores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  flota-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: flota-service
    image: sitrac/flota-service
    container_name: sitrac-flota-service
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      MYSQL_FLOTA_URL: "jdbc:mysql://mysql:3306/sitrac_flota?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  programacion-service:
    build:
      context: .
      args:
        SERVICE: programacion-service
    image: sitrac/programacion-service
    container_name: sitrac-programacion-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      MYSQL_PROGRAMACION_URL: "jdbc:mysql://mysql:3306/sitrac_programaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-sitrac}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

  viaje-service:
    build:
      context: .
      args:
        SERVICE: viaje-service
    image: sitrac/viaje-service
    container_name: sitrac-viaje-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      MYSQL_VIAJE_URL: "jdbc:mysql://mysql:3306/sitrac_viajes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      PROGRAMACION_SERVICE_URL: http://programacion-service:8086
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-sitrac}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

  combustible-service:
    build:
      context: .
      args:
        SERVICE: combustible-service
    image: sitrac/combustible-service
    container_name: sitrac-combustible-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      <<: *common-env
      MYSQL_COMBUSTIBLE_URL: "jdbc:mysql://mysql:3306/sitrac_combustible?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      PROGRAMACION_SERVICE_URL: http://programacion-service:8086
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-sitrac}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      programacion-service:
        condition: service_started

  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    image: sitrac/notification-service
    container_name: sitrac-notification-service
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-sitrac}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sitracmq}
      SITRAC_MAIL_ENABLED: ${SITRAC_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      programacion-service:
        condition: service_started
      pedido-service:
        condition: service_started
      cliente-service:
        condition: service_started
      conductor-service:
        condition: service_started

  frontend:
    build: ./sitrac-frontend
    image: sitrac/frontend
    container_name: sitrac-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
