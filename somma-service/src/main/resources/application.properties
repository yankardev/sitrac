spring.application.name=somma-service
server.port=8089

spring.datasource.url=${MYSQL_SOMMA_URL:jdbc:mysql://localhost:3306/sitrac_somma?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

services.programacion.url=${PROGRAMACION_SERVICE_URL:http://localhost:8086}
